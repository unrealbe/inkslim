services:
  inkslim:
    # Use the prebuilt image...
    image: ghcr.io/unrealbe/inkslim:latest
    # ... or build it locally:
    #build: .
    container_name: inkslim
    restart: unless-stopped
    ports:
      - "8080:8080"          # host:container, change the left side if 8080 is taken
    environment:
      MAX_UPLOAD_MB: "500"
