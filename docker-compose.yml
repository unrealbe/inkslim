services:
  web:
    image: ghcr.io/unrealbe/inkslim:latest
    container_name: inkslim
    restart: unless-stopped
    ports:
      - "8125:8080"          # host:container, change the left side if 8125 is taken
    environment:
      - MAX_UPLOAD_MB=500
      - JOB_RETENTION_HOURS=24
      - MAX_CONVERSION_STORAGE_MB=5120
      - SHRINK_TIMEOUT=840
      - LOG_LEVEL=INFO
      - INKSLIM_DATA_DIR=/data/conversion
      # Optional: enable "Send to Calibre-Web" button by mounting your CWA ingest folder:
      # - CWA_INGEST_DIR=/cwa-book-ingest
      # Uncomment both to require a login:
      # - BASIC_AUTH_USER=me
      # - BASIC_AUTH_PASS=choose-a-strong-password
    volumes:
      - conversion-data:/data/conversion
      # - /path/to/cwa-book-ingest:/cwa-book-ingest

  worker:
    image: ghcr.io/unrealbe/inkslim:latest
    container_name: inkslim-worker
    restart: unless-stopped
    command: ["python", "-m", "conversion"]
    environment:
      - LOG_LEVEL=INFO
      - INKSLIM_DATA_DIR=/data/conversion
      - JOB_RETENTION_HOURS=24
      - MAX_CONVERSION_STORAGE_MB=5120
      - QUEUE_POLL_SECONDS=2
      - PDF_RENDER_DPI=300
      - MIN_RENDER_DPI=120
      - MAX_RENDER_PIXELS=50000000
      - MAX_RENDER_DIMENSION=12000
      - OCR_WORKERS=1
      # Optional: AI-assisted chapter structure refinement via Gemini.
      # Provide your API key to enable. The pipeline is fully functional without it.
      # - GEMINI_API_KEY=your-api-key-here
      # - GEMINI_MODEL=gemini-2.0-flash-lite   # default; override if needed
      # - GEMINI_TIMEOUT_SECONDS=30             # default; increase for slow networks
    volumes:
      - conversion-data:/data/conversion
    # The image healthcheck targets the Flask web endpoint, which is not
    # running in this service. Docker Compose must not apply that check here.
    healthcheck:
      disable: true

volumes:
  conversion-data:
