name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y imagemagick zip unzip shellcheck
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Download EPUBCheck 5.4.0
        run: |
          curl -fsSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          echo "EPUBCHECK_JAR=$PWD/epubcheck-5.4.0/epubcheck.jar" >> "$GITHUB_ENV"
      - name: Lint shell script
        run: shellcheck epub-shrink.sh
      - name: Run tests
        run: pytest -q
