name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y imagemagick zip unzip shellcheck
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint shell script
        run: shellcheck epub-shrink.sh
      - name: Run tests
        run: pytest -q
